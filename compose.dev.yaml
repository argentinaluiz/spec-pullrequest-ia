services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    # Faz o contêiner parado encerrar na hora no `down`.
    init: true
    ports:
      # A porta da máquina segue o slot (docs/lld.md, seção 6, "Ambiente local por slot"); sem o `.env`,
      # é a de hoje.
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
    environment:
      # A web chama a API sempre pelo servidor, pelo nome do serviço.
      API_URL: http://api:3000
      # O ambiente local usa HTTP, e o navegador descartaria um cookie `Secure`.
      COOKIE_SECURE: "false"
      # Autoriza a web a repassar à API o IP do navegador. É o mesmo valor do apps/api/.env.example.
      INTERNAL_API_SECRET: segredo-interno-so-do-ambiente-local
    healthcheck:
      # O arquivo é criado quando a instalação das dependências termina.
      test: ["CMD", "test", "-f", "/tmp/web-ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10m
      # Durante a preparação, confere a cada segundo, para o `up --wait` não esperar à toa.
      start_interval: 1s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    init: true
    ports:
      # Na máquina a API fica na 3001 do slot 0; entre contêineres, em http://api:3000.
      - "${API_PORT:-3001}:3000"
    environment:
      # Os endereços que seguem o slot (docs/lld.md, seção 6, "Ambiente local por slot"). Sem valor: o
      # Compose os lê do `.env`, e sem o `.env` eles não existem aqui, e a API usa o `apps/api/.env`. O
      # ambiente do processo vale mais do que o `.env` da API.
      WEB_ORIGIN:
      STORAGE_PUBLIC_URL:
      STORAGE_EMULATOR_HOST:
    volumes:
      - ./apps/api:/app
      # O repositório inteiro, só para leitura, para o Node do harness (scripts/node-in-api.sh) ler
      # os scripts, os arquivos de aceite e os relatórios das apps sem cópia. As escritas continuam
      # em /app.
      - .:/repo:ro
      # O .git do repositório fica coberto: nada no contêiner usa o Git, e assim o histórico, os hooks e
      # a configuração dele ficam fora do alcance do que roda aqui. No checkout principal e na CI, o .git
      # é uma pasta, e a máscara é uma pasta vazia (tmpfs). Num worktree, o .git é um arquivo, onde o tmpfs
      # não monta: o `.env` do worktree traz GIT_MASK_TYPE=bind e GIT_MASK_SOURCE=/dev/null, que o cobre
      # com um arquivo vazio (docs/lld.md, seção 6, "Máscara do `.git`").
      - type: ${GIT_MASK_TYPE:-tmpfs}
        source: ${GIT_MASK_SOURCE:-}
        target: /repo/.git
        read_only: true
    depends_on:
      # As migrações rodam na subida do contêiner, então o banco precisa aceitar conexões antes.
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      storage:
        condition: service_healthy
    healthcheck:
      # O arquivo é criado no fim da preparação (dependências, .env, chaves e migrações).
      test: ["CMD", "test", "-f", "/tmp/api-ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10m
      # Durante a preparação, confere a cada segundo, para o `up --wait` não esperar à toa.
      start_interval: 1s

  playwright:
    # Os navegadores vêm na imagem. A versão é a mesma do `@playwright/test` do
    # apps/web/package.json: ao atualizar uma, atualize a outra.
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    init: true
    # O Chromium usa memória compartilhada, e os 64 MB padrão do Docker não bastam para a suíte em paralelo.
    ipc: host
    # O mesmo usuário do contêiner `web`, para os relatórios não nascerem como root na máquina.
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ./apps/web:/app
    environment:
      WEB_URL: http://web:3000
      MAILPIT_URL: http://mailpit:8025
      # O banco da API que a web usa, para os testes gravarem Itens como preparação até o
      # upload existir (apps/web/AGENTS.md, "Testes no navegador").
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      # A API, para os testes criarem o envio e pedirem a URL de leitura (POST /uploads e GET /items/{id}/download-url).
      API_URL: http://api:3000
      # O endereço público do storage do slot, que os testes conferem nas URLs. Sem valor: o Compose a
      # lê do `.env`, e sem o `.env` ela não existe, e os testes usam o do slot 0.
      STORAGE_PUBLIC_URL:
    depends_on:
      # Usa a `node_modules` que o contêiner `web` instala.
      web:
        condition: service_healthy
      mailpit:
        condition: service_started
      postgres:
        condition: service_healthy
    # Fica parado, como `web` e `api`. Os testes são rodados com `docker compose exec`.
    command: ["tail", "-f", "/dev/null"]

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Por TCP, e não pelo socket: na primeira subida a imagem roda um servidor
      # temporário, só no socket, para criar o banco, e ele ainda não é o definitivo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 1m
      start_interval: 1s

  mailpit:
    image: axllent/mailpit:v1.30
    ports:
      # Tela e API HTTP dos e-mails capturados. O SMTP (1025) só é usado entre contêineres.
      - "${MAILPIT_PORT:-8025}:8025"

  storage:
    # Emulador do Cloud Storage. A versão é fixa: o comportamento do emulador está medido
    # contra ela (docs/lld.md, seção 4.6).
    image: fsouza/fake-gcs-server:1.56.1
    init: true
    ports:
      # É a porta que o navegador de quem desenvolve alcança (STORAGE_PUBLIC_URL). O emulador escuta
      # nela também dentro do contêiner, para o navegador dos testes, que só troca o host, chegar a ele.
      - "${STORAGE_PORT:-4443}:${STORAGE_PORT:-4443}"
    # O emulador monta o endereço da sessão e serve a URL assinada pelo `Host` da requisição,
    # e só atende a URL assinada quando ele é o `-public-host`. O bucket nasce da pasta
    # /data/app-files, que o entrypoint cria antes de iniciar o emulador.
    entrypoint:
      - sh
      - -c
      - mkdir -p /data/app-files && exec /bin/fake-gcs-server -data /data -scheme http -backend memory -port ${STORAGE_PORT:-4443} -public-host localhost:${STORAGE_PORT:-4443}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${STORAGE_PORT:-4443}/storage/v1/b/app-files"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

volumes:
  postgres-data:
